name: Comment YAML Diff Links

on:
  pull_request_target:
    paths:
      - "*.yaml"
      - "*.yml"
    types: [opened, synchronize]

jobs:
  comment-diff-links:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install PyYAML, tyro, and CPU PyTorch
        run: |
          pip install pyyaml tyro numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Get changed YAML files and extract trainer/stockfish info
        id: changed-files
        shell: python
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import yaml
          import json
          import subprocess
          import sys
          import os

          base_sha = os.environ['PR_BASE_SHA']
          head_sha = os.environ['PR_HEAD_SHA']

          # Get changed files
          result = subprocess.run(
              ['git', 'diff', '--name-only', base_sha, head_sha],
              capture_output=True, text=True
          )
          changed_files = [f for f in result.stdout.strip().split('\n') if f and not f.startswith('/') and f.endswith(('.yaml', '.yml'))]

          trainer_changes = []
          stockfish_changes = []
          repo_refs = set()

          def add_repo_ref(owner, repo, sha, file):
              if owner and repo and sha:
                  repo_refs.add((owner, repo, sha, file))

          for file in changed_files:
              try:
                  # Get old content
                  old_result = subprocess.run(
                      ['git', 'show', f'{base_sha}:{file}'],
                      capture_output=True, text=True
                  )
                  old_content = yaml.safe_load(old_result.stdout) if old_result.returncode == 0 else {}
              except:
                  old_content = {}
              
              # Get new content
              try:
                  with open(file, 'r') as f:
                      new_content = yaml.safe_load(f)
              except:
                  new_content = {}
              
              # Extract trainers from training steps
              old_steps = old_content.get('training', {}).get('steps', []) if old_content else []
              new_steps = new_content.get('training', {}).get('steps', []) if new_content else []
              
              # Compare trainers for each step
              max_steps = max(len(old_steps), len(new_steps))
              for i in range(max_steps):
                  old_step = old_steps[i] if i < len(old_steps) else {}
                  new_step = new_steps[i] if i < len(new_steps) else {}
                  
                  old_trainer = old_step.get('trainer', {})
                  new_trainer = new_step.get('trainer', {})
                  
                  old_sha = old_trainer.get('sha', '')
                  new_sha = new_trainer.get('sha', '')
                  new_owner = new_trainer.get('owner', 'official-stockfish')
                  
                  add_repo_ref(new_owner, 'nnue-pytorch', new_sha, file)

                  if new_sha and old_sha != new_sha:
                      trainer_changes.append({
                          'file': file,
                          'step': i + 1,
                          'old_sha': old_sha,
                          'new_sha': new_sha,
                          'owner': new_owner,
                          'repo': 'nnue-pytorch'
                      })
                      # .nnue size estimation: the model configs for base and head
                      # (what nettest passes to serialize.py — see convert.checkpoint2nnue)
                      def _cfg(step):
                          c = (step.get('convert', {}) or {}).get('checkpoint2nnue') or {}
                          return {
                              'features': c.get('features', ''),
                              'l1': c.get('l1', 1024),
                              'l2': c.get('l2', 32),
                          }
                      old_cfg = _cfg(old_step)
                      new_cfg = _cfg(new_step)
                      if old_cfg['features'] and new_cfg['features']:
                          trainer_changes[-1]['base_config'] = old_cfg
                          trainer_changes[-1]['head_config'] = new_cfg
                  elif new_sha and not old_sha:
                      trainer_changes.append({
                          'file': file,
                          'step': i + 1,
                          'old_sha': '',
                          'new_sha': new_sha,
                          'owner': new_owner,
                          'repo': 'nnue-pytorch',
                          'is_new': True
                      })
              
              # Extract Stockfish reference/testing
              old_testing = old_content.get('testing', {}) if old_content else {}
              new_testing = new_content.get('testing', {}) if new_content else {}

              # Crosscheck trainer
              new_crosscheck_trainer = new_testing.get('crosscheck', {}).get('trainer', {}) if new_testing else {}
              add_repo_ref(new_crosscheck_trainer.get('owner', 'official-stockfish'), 'nnue-pytorch', new_crosscheck_trainer.get('sha', ''), file)
               
              # Reference
              old_ref = old_testing.get('reference', {}).get('code', {}) if old_testing else {}
              new_ref = new_testing.get('reference', {}).get('code', {}) if new_testing else {}
              
              add_repo_ref(new_ref.get('owner', 'official-stockfish'), 'Stockfish', new_ref.get('sha', ''), file)

              if new_ref.get('sha') and old_ref.get('sha') != new_ref.get('sha'):
                  stockfish_changes.append({
                      'file': file,
                      'type': 'reference',
                      'old_sha': old_ref.get('sha', ''),
                      'new_sha': new_ref.get('sha', ''),
                      'owner': new_ref.get('owner', 'official-stockfish'),
                      'repo': 'Stockfish'
                  })
              
              # Testing
              old_test = old_testing.get('testing', {}).get('code', {}) if old_testing else {}
              new_test = new_testing.get('testing', {}).get('code', {}) if new_testing else {}
              
              add_repo_ref(new_test.get('owner', 'official-stockfish'), 'Stockfish', new_test.get('sha', ''), file)

              if new_test.get('sha') and old_test.get('sha') != new_test.get('sha'):
                  stockfish_changes.append({
                      'file': file,
                      'type': 'testing',
                      'old_sha': old_test.get('sha', ''),
                      'new_sha': new_test.get('sha', ''),
                      'owner': new_test.get('owner', 'official-stockfish'),
                      'repo': 'Stockfish'
                  })

              # Fastchess
              new_fastchess = new_testing.get('fastchess', {}).get('code', {}) if new_testing else {}
              add_repo_ref(new_fastchess.get('owner'), 'fastchess', new_fastchess.get('sha', ''), file)

          # Output results
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"changed_files<<EOF\n{' '.join(changed_files)}\nEOF\n")
              f.write(f"trainer_changes<<EOF\n{json.dumps(trainer_changes)}\nEOF\n")
              f.write(f"stockfish_changes<<EOF\n{json.dumps(stockfish_changes)}\nEOF\n")
              f.write(f"repo_refs<<EOF\n{json.dumps(sorted(repo_refs))}\nEOF\n")

      - name: Validate referenced SHAs exist in declared repos
        if: steps.changed-files.outputs.changed_files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const refs = JSON.parse(`${{ steps.changed-files.outputs.repo_refs }}` || '[]');

            if (refs.length === 0) return;

            const seen = new Set();
            const missing = [];

            for (const [owner, repo, sha, file] of refs) {
              const key = `${owner}/${repo}@${sha}`;
              if (seen.has(key)) continue;
              seen.add(key);

              try {
                await github.rest.repos.getCommit({ owner, repo, ref: sha });
              } catch (error) {
                if (error.status === 404) {
                  missing.push(`- ${file}: \`${owner}/${repo}@${sha}\` was not found`);
                  continue;
                }
                throw error;
              }
            }

            if (missing.length > 0) {
              core.setFailed([
                'Some referenced SHAs do not exist in the repos declared by the YAML:',
                ...missing,
                'This usually means the commit exists locally but has not been pushed yet.'
              ].join('\n'));
            }

      - name: Estimate .nnue sizes (if a trainer changed)
        if: steps.changed-files.outputs.trainer_changes != ''
        id: estimate-sizes
        env:
          TRAINER_CHANGES: ${{ steps.changed-files.outputs.trainer_changes }}
        run: |
          echo "$TRAINER_CHANGES" > /tmp/trainer_changes.json
          python - <<'EOF'
          import json, os, subprocess

          with open("/tmp/trainer_changes.json") as f:
              changes = json.load(f)

          results = []
          for change in changes:
              if "base_config" not in change or "head_config" not in change:
                  continue

              new_sha = change["new_sha"]
              new_owner = change.get("owner", "official-stockfish")
              repo_dir = f"/tmp/nnue-pytorch-{new_sha[:12]}"
              repo_url = f"https://github.com/{new_owner}/nnue-pytorch.git"

              if not os.path.isdir(repo_dir):
                  os.makedirs(repo_dir, exist_ok=True)
                  # follow nettest's ensure_trainer pattern: init, fetch, checkout
                  subprocess.run(
                      ["git", "init", "-q"], check=True, cwd=repo_dir,
                  )
                  subprocess.run(
                      ["git", "remote", "add", "origin", repo_url], check=True, cwd=repo_dir,
                  )
                  subprocess.run(
                      ["git", "fetch", "-q", "--depth", "1", "origin", new_sha], check=True, cwd=repo_dir,
                  )
                  subprocess.run(
                      ["git", "checkout", "-q", "--detach", "FETCH_HEAD"], check=True, cwd=repo_dir,
                  )
                  # install the trainer's requirements (torch stays the CPU wheel)
                  req = os.path.join(repo_dir, "requirements.txt")
                  if os.path.isfile(req):
                      subprocess.run(
                          ["pip", "install", "-q", "-r", req],
                          check=True,
                      )

              base_cfg = change["base_config"]
              head_cfg = change["head_config"]

              sizes = {}
              for label, cfg in (("base", base_cfg), ("head", head_cfg)):
                  cmd = [
                      "python",
                      "serialize.py",
                      "--estimate-size",
                      f"--features={cfg['features']}",
                      f"--l1={cfg['l1']}",
                      f"--l2={cfg['l2']}",
                  ]
                  proc = subprocess.run(
                      cmd, capture_output=True, text=True, cwd=repo_dir,
                      env={**os.environ, "PYTHONPATH": repo_dir},
                  )
                  if proc.returncode != 0:
                      sizes[label] = None
                      # sanitize: no raw newlines in the JSON (breaks the parse)
                      sizes["error"] = (
                          proc.stderr.strip()[-500:].replace("\n", " | ")
                      )
                      break
                  # parse: Estimated .nnue size: N bytes
                  import re
                  m = re.search(r"size:\s*([\d,]+)", proc.stdout)
                  if m:
                      sizes[label] = int(m.group(1).replace(",", ""))
                  else:
                      sizes[label] = None
                      sizes["error"] = "unparsable output: " + proc.stdout[-200:]
                      break

              results.append({
                  "file": change["file"],
                  "step": change["step"],
                  **sizes,
              })

          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"nnue_sizes<<EOF\n{json.dumps(results)}\nEOF\n")
          EOF

      - name: Comment PR with diff links
        if: steps.changed-files.outputs.changed_files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoDefaults = new Map();

            // Defensive parsing: a malformed output must degrade gracefully,
            // not crash the whole comment step.
            function safeParse(name, raw) {
              try {
                return JSON.parse(raw || '[]');
              } catch (e) {
                core.warning(`Malformed ${name} output (${e.message}); falling back to []. Raw: ${raw}`);
                return [];
              }
            }

            const trainerChanges = safeParse('trainer_changes', `${{ steps.changed-files.outputs.trainer_changes }}`);
            const stockfishChanges = safeParse('stockfish_changes', `${{ steps.changed-files.outputs.stockfish_changes }}`);
            const nnueSizes = safeParse('nnue_sizes', `${{ steps.estimate-sizes.outputs.nnue_sizes }}`);

            if (trainerChanges.length === 0 && stockfishChanges.length === 0) return;

            async function getDefaultBranch(owner, repo) {
              const key = `${owner}/${repo}`;
              if (!repoDefaults.has(key)) {
                const { data } = await github.rest.repos.get({ owner, repo });
                repoDefaults.set(key, data.default_branch);
              }
              return repoDefaults.get(key);
            }

            async function buildMainCompare(owner, repo, sha) {
              const defaultBranch = await getDefaultBranch(owner, repo);
              return `[vs ${defaultBranch}](https://github.com/${owner}/${repo}/compare/${defaultBranch}...${sha})`;
            }

            let body = '';

            // .nnue size check (concise, green or red, both mention the sizes)
            if (nnueSizes.length > 0) {
              body += '### 📦 .nnue Size\n';
              for (const size of nnueSizes) {
                const limitBytes = 200 * 2**20;
                const mib = (x) => (x / 2**20).toFixed(1);
                if (size.error) {
                  body += `- ⚠️ ${size.file} (step ${size.step}): estimate unavailable (${size.error})\n`;
                } else if (size.head > limitBytes) {
                  body += `- ❌ ${size.file} (step ${size.step}): ${mib(size.base)} MiB (master) → ${mib(size.head)} MiB (new) — exceeds the 200 MiB limit\n`;
                } else {
                  body += `- ✅ ${size.file} (step ${size.step}): ${mib(size.base)} MiB (master) → ${mib(size.head)} MiB (new)\n`;
                }
              }
              body += '\n';
            }

            if (trainerChanges.length > 0) {
              body += '### 🧠 Trainer Changes (nnue-pytorch)\n';
              for (const change of trainerChanges) {
                const stepLabel = change.step ? `Step ${change.step}` : 'Trainer';
                const mainCompare = await buildMainCompare(change.owner, change.repo, change.new_sha);
                if (change.old_sha) {
                  body += `- **${change.file}** (${stepLabel}): [${change.old_sha.substring(0, 7)}...${change.new_sha.substring(0, 7)}](https://github.com/${change.owner}/${change.repo}/compare/${change.old_sha}...${change.new_sha}) (${mainCompare})\n`;
                } else {
                   body += `- **${change.file}** (${stepLabel}): New trainer [${change.new_sha.substring(0, 7)}](https://github.com/${change.owner}/${change.repo}/commit/${change.new_sha}) (${mainCompare})\n`;
                }
              }
              body += '\n';
            }

            if (stockfishChanges.length > 0) {
              body += '### ♟️ Stockfish Changes\n';
              for (const change of stockfishChanges) {
                const typeLabel = change.type.charAt(0).toUpperCase() + change.type.slice(1);
                const mainCompare = await buildMainCompare(change.owner, change.repo, change.new_sha);
                if (change.old_sha) {
                  body += `- **${change.file}** (${typeLabel}): [${change.old_sha.substring(0, 7)}...${change.new_sha.substring(0, 7)}](https://github.com/${change.owner}/${change.repo}/compare/${change.old_sha}...${change.new_sha}) (${mainCompare})\n`;
                } else {
                  body += `- **${change.file}** (${typeLabel}): New [${change.new_sha.substring(0, 7)}](https://github.com/${change.owner}/${change.repo}/commit/${change.new_sha}) (${mainCompare})\n`;
                }
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              (c.body.includes('🧠 Trainer Changes') || c.body.includes('♟️ Stockfish Changes'))
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body
              });
            }
