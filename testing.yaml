training_binpacks: &training_binpacks
  - vondele/from_kaggle_2_relabel/T60T70wIsRightFarseerT60T74T75T76.split_0.relabel-BT4-tf13tune.binpack
  - vondele/rescored/tb5dtm.binpack

histfix_binpacks: &histfix_binpacks
  - xushawn/test80-bt4-relabel/test80-2024-02-feb-2tb7p.min-v2.v6.relabel-BT4-tf13tune-histfix.binpack
  - xushawn/t91-lgs/binpacks/v6-bt4/test91-2026-08-aug-150gb6p.v6.c960.relabel-BT4-tf13tune-histfix.binpack

model_config: &model_config
  features: Full_Threats+PP_3Wide+Ram_Ram+K32H3^
  l1: 1024
  l2: 32
  ls-keys: "half:offi"
  ls-factors: "base:half:offi"

optimize_flags: &optimize_flags
  <<: *model_config
  ft-optimize-count: 100000
  ft-optimize: true
  compression: none

checkpoint2nnue_options: &checkpoint2nnue_options
  <<: *model_config
  compression: none

common_run_options: &common_run_options
  optimizer-name: adamw
  epoch-size: 10485760
  validation-size: 2621440
  check-val-every-n-epoch: 10
  batch-size: 131072
  <<: *model_config
  factorized-weight-decay: "4.0e-5"
  random-fen-skipping: 3
  early-fen-skipping: 18
  soft-early-fen_skipping: 32
  pc-y0: -0.20
  pc-y1: 0.45
  pc-y2: 1.0
  pc-y3: 0.95
  pc-y4: 0.75
  ply-x1: 0.00
  ply-y1: 0.025
  ply-x2: 22.0
  ply-y2: 0.05
  ply-x3: 25.5
  ply-y3: 0.20
  ply-x4: 29.5
  ply-y4: 0.80
  pow-exp: 2.4340402395048404
  qp-asymmetry: 0.22866886710086187
  in-scaling: 295.6539508488627
  out-scaling: 379.98724077106635
  in-offset: 285.2706341467852
  out-offset: 289.1258344152218
  one-cycle-warmup-pct: 0.05
  one-cycle-final-div: "1e3"
  lambda-cycle-jitter: true
  jitter-lambda-sample: 0.0035
  jitter-lambda-batch: 0.0070
  jitter-decay-lambda-batch: 0.999
  start-lambda: 1.0
  end-lambda: 1.0
  lambda-cycle-warmup-pct: 0.25
  lambda-cycle-delta: -0.3

trainer: &trainer
  owner: xu-shawn
  sha: 670cf8bbcacce3df6831a073662a24d55d7b80cf # ram-k32h3-lskeys: layer-stack keys --ls-keys (half, offi, imb3) on ram-k32h3-imb3 3b11d0d

reference_code: &reference_code
  owner: official-stockfish
  sha: dbe600b7438662e9ade60b31fa0625259dcd0077 # master from 2026-10-24, the testing engine's base
  target: build

testing_code: &testing_code
  owner: xu-shawn
  sha: 85d0015dd8475c12236625ffe795b7d418f1799b # ram-k32h3-halfoffi: 192 layer stacks by pawn halves x officers on ram-k32h3 bd16e30e
  target: build

# --- Grouped Structure Anchors for Redundancy Reduction ---
common_convert: &common_convert
  binpack: official-stockfish/master-binpacks/fishpack32.binpack
  checkpoint2nnue: *checkpoint2nnue_options
  optimize: *optimize_flags

common_step: &common_step
  convert: *common_convert
  trainer: *trainer

common_run_resume_model: &common_run_resume_model
  repetitions: 1
  resume: previous_model

common_run_resume_ckpt: &common_run_resume_ckpt
  <<: *common_run_resume_model
  resume: previous_checkpoint

# ----------------------------------------------------------

testing:
  crosscheck:
    binpack: official-stockfish/master-binpacks/fishpack32.binpack
    other_options:
      <<: *model_config
      count: 20000
  fastchess:
    code:
      owner: Disservin
      sha: 60d7a7a26c6b0582a15c112fb29a1829bef2adb3 # # from 2026-09-12
    options:
      hash: 16
      max_rounds: 30000
      tc: 10+0.1
    sprt:
      nElo_interval_midpoint: -0.0
      nElo_interval_width: 2

  reference:
    code: *reference_code
  steps: last
  testing:
    code: *testing_code

training_length_options: &training_length_options
  one-cycle-steps: 5108000
  lambda-schedule-steps: 5052000
  lr: "0.4e-3"

training:
  steps:
    # Pretraining
    - <<: *common_step
      run:
        resume: none
        binpacks: *training_binpacks
        max_epochs: 4
        network-save-period: 0
        other_options:
          <<: [*training_length_options, *common_run_options]

    # Finetuning
    - <<: *common_step
      trainer: *trainer
      run:
        <<: *common_run_resume_ckpt
        binpacks: *training_binpacks
        max_epochs: 4
        network-save-period: 0
        other_options:
          <<: [*training_length_options, *common_run_options]
          batch_size: 65536

    # Finetuning on the histfix relabels (test80 2024, T91) to the end of the learning-rate schedule
    - <<: *common_step
      trainer: *trainer
      run:
        <<: *common_run_resume_ckpt
        binpacks: *histfix_binpacks
        max_epochs: 5
        network-save-period: 0
        other_options:
          <<: [*training_length_options, *common_run_options]
          batch_size: 65536
