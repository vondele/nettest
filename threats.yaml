model_config: &model_config
  features: Full_Threats+PP_3Wide+K32H3^
  l1: 1024
  l2: 32
  moe-shared-router: true
  moe-tail-experts: 64
  moe-context-dim: 2048
  moe-fc0-codebook-dim: 64
  moe-tail-codebook-dim: 64
  moe-balance-power: 0.4658379531227075
  moe-adapter-diversity-cost: 0.012
  moe-fc0-weight-diversity-cost: 0.002
  moe-tail-weight-diversity-cost: 0.002
  weight-scale-l1: 256
  weight-scale-l2: 128

optimize_flags: &optimize_flags
  <<: *model_config
  ft-optimize-count: 100000
  ft-optimize: true
  compression: none

checkpoint2nnue_options: &checkpoint2nnue_options
  <<: *model_config
  compression: none

common_run_options: &common_run_options
  optimizer-name: adamw
  epoch-size: 1073741824
  validation-size: 268435456
  check-val-every-n-epoch: 10
  batch-size: 131072
  <<: *model_config
  dense-weight-decay: 0.001
  ft-weight-decay: 0.02
  virtual-ft-weight-decay: 0.02
  ft-bucket-lr-mult: 0.25
  threat-lr-mult: 0.5
  fake-quant-warmup-steps: 255400
  init-seed: 1
  input-clipping-interval: 1024
  tree-sample-accept: 0.12
  matmul-precision: &moe9_precision high
  moe-context-commitment-cost: 0.0002
  moe-centroid-commitment-cost: 0.0001
  moe-balance-strength: 0.3
  moe-balance-max-strength: 0.95
  moe-balance-ema-smoothing: 0.01
  moe-balance-max-range: 4.0
  moe-offset-ema-decay: 0.9
  moe-reseed-interval: 256
  moe-reseed-ema-decay: 0.9
  moe-reseed-min-relative-utilization: 0.064
  random-fen-skipping: 3
  early-fen-skipping: 18
  soft-early-fen_skipping: 32
  pc-y0: -0.20
  pc-y1: 0.45
  pc-y2: 1.0
  pc-y3: 0.95
  pc-y4: 0.75
  ply-x1: 0.00
  ply-y1: 0.025
  ply-x2: 22.0
  ply-y2: 0.05
  ply-x3: 25.5
  ply-y3: 0.20
  ply-x4: 29.5
  ply-y4: 0.80
  pow-exp: 2.4340402395048404
  qp-asymmetry: 0.22866886710086187
  in-scaling: 295.6539508488627
  out-scaling: 379.98724077106635
  in-offset: 285.2706341467852
  out-offset: 289.1258344152218
  one-cycle-warmup-pct: 0.05
  one-cycle-final-div: 800
  lambda-cycle-jitter: true
  jitter-lambda-sample: 0.0035
  jitter-lambda-batch: 0.0070
  jitter-decay-lambda-batch: 0.999
  start-lambda: 1.0
  end-lambda: 1.0
  lambda-cycle-warmup-pct: 0.25
  lambda-cycle-delta: -0.3

trainer: &trainer
  owner: TonyCongqianWang
  sha: 8aebf5693f16a896189c26c7ee0fc89fc45da681

reference_code: &reference_code
  owner: official-stockfish
  sha: def601cc156f7d41f9ddea76d74515eddf232aaf
  target: build

testing_code: &testing_code
  owner: TonyCongqianWang
  sha: 4644f61b6966c7471b47d2fe9f7afe3597ee8fa4
  target: build

common_convert: &common_convert
  binpack: official-stockfish/master-binpacks/fishpack32.binpack
  checkpoint2nnue: *checkpoint2nnue_options
  optimize: *optimize_flags
  export_diagnostics: true
  runtime:
    device: cuda:0
    matmul-precision: *moe9_precision

common_step: &common_step
  convert: *common_convert
  trainer: *trainer

training_length_options: &training_length_options
  one-cycle-steps: 5108000
  lambda-schedule-steps: 5052000
  lr: "0.4e-3"

# Keep testing and the full schedule here. For diagnostic runs, comment/uncomment
# the relevant blocks instead of deleting them.
testing:
  crosscheck:
    binpack: official-stockfish/master-binpacks/fishpack32.binpack
    other_options:
      <<: *model_config
      count: 20000
  fastchess:
    code:
      owner: Disservin
      sha: 60d7a7a26c6b0582a15c112fb29a1829bef2adb3
    options:
      hash: 16
      max_rounds: 30000
      tc: 10+0.1
    sprt:
      nElo_interval_midpoint: -0.0
      nElo_interval_width: 2
  reference:
    code: *reference_code
  steps: all
  testing:
    code: *testing_code

training:
  steps:
    # Retain the diagnostic checkpoint; all later stages resume it rather than restart.
    - <<: *common_step
      run:
        resume: none
        binpacks: *training_binpacks
        max_epochs: 100
        network-save-period: 0
        repetitions: 1
        other_options:
          <<: [*training_length_options, *common_run_options]
          final-validation-multiplier: 4

    # Continue pretraining from the saved 100-epoch checkpoint.
    - <<: *common_step
      run:
        resume: previous_checkpoint
        binpacks: *training_binpacks
        max_epochs: 560
        network-save-period: 0
        repetitions: 3
        other_options:
          <<: [*training_length_options, *common_run_options]
          final-validation-multiplier: 4

    # Smaller batch size belongs only in this final stage.
    - <<: *common_step
      run:
        resume: previous_checkpoint
        binpacks: *training_binpacks
        max_epochs: 600
        network-save-period: 0
        repetitions: 1
        other_options:
          <<: [*training_length_options, *common_run_options]
          batch-size: 65536
          final-validation-multiplier: 4
