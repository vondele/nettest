  l1: 1024
  l2: 32

optimize_flags: &optimize_flags
  <<: *model_config
  ft-optimize-count: 100000
  ft-optimize: true
  ft-compression: leb128

checkpoint2nnue_options: &checkpoint2nnue_options
  <<: *model_config
  ft-compression: leb128

common_run_options: &common_run_options
  epoch-size: 134217728
  batch-size: 131072
  one-cycle-steps: 4096000
  lr: "0.9e-3"
  start_lambda: 1.0
  end_lambda: 1.0
  pow_exp: 2.2458593774318936
  qp_asymmetry: 0.16123193074123665
  w1: 3.4992759013258348
  w2: 0.24990297747029686
  soft_early_fen_skipping: 55
  ply_x1: 15
  ply_x2: 25
  ply_x3: 35
  ply_x4: 45
  ply_y1: 0.4995834610368314
  ply_y2: 0.4755898062623219
  ply_y3: 0.7960350956742267
  ply_y4: 0.5268709998474687
  pc-y0: -0.021286239983835456
  pc-y1: 0.4630376436225087
  pc-y2: 0.8119190849177433
  pc-y3: 0.8432669372128858
  pc-y4: 0.8307417849554223
  cdb-path: "/workspace/cdb/chess-20260702/data"
  cdb-fraction: 0.99
  wld_filtered: False
  random_fen_skipping: 0
