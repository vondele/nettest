  out_scaling: 289.58605293609645
  <<: *model_config

trainer: &trainer
  owner: vondele
  sha: 8b13e4eaad33a2852f0546f9060a982cbee110b2

reference_code: &reference_code
  owner: official-stockfish
  sha: 23cf5d827388e84d4389b40025ef401db4925f25
  target: profile-build

testing_code: &testing_code
  <<: *reference_code

# --- Grouped Structure Anchors for Redundancy Reduction ---
common_convert: &common_convert
  binpack: official-stockfish/master-binpacks/fishpack32.binpack
  checkpoint2nnue: *checkpoint2nnue_options
  optimize: *optimize_flags

common_step: &common_step
  convert: *common_convert
  trainer: *trainer

testing:
  crosscheck:
    trainer: *trainer
    binpack: official-stockfish/master-binpacks/fishpack32.binpack
    other_options:
      <<: *model_config
      count: 20000
  fastchess:
    code:
      owner: Disservin
      sha: b9008d08b9f375ef7810dc55da6ff223a3992cc2
    options:
      hash: 16
      max_rounds: 10000
      tc: 10+0.1
  reference:
    code: *reference_code
  steps: last
  testing:
    code: *testing_code


training:
  steps:
    # Pretraining
    - <<: *common_step
      run:
        resume: none
        binpacks: *training_binpacks
        max_epochs: 8400
        repetitions: 7
        other_options:
          <<: *common_run_options
